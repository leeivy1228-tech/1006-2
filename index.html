<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 設定字元編碼為 UTF-8 -->
  <meta charset="UTF-8">
  <!-- 設定響應式 Viewport，防止手機端使用者縮放並支援全螢幕呈現 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國中英文單字響應式測驗系統 - p5.js</title>
  <!-- 引入 p5.js CDN 核心庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    /* 移除網頁預設邊界與捲軸，確保全螢幕呈現 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121216;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      /* 禁止使用者選取文字 */
      user-select: none;
      -webkit-user-select: none;
    }
    /* 設定畫布居中並消除邊框 */
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>

<script>

// 宣告全域變數：存放所有測驗題目的陣列
let questions = [];

// 宣告全域變數：當前正在進行的題目索引 (0 到 4)
let currentQ = 0;

// 宣告全域變數：記錄使用者答對的累計題數
let score = 0;

// 宣告全域變數：控制畫面狀態 ("QUESTION" - 答題中, "ANSWERED" - 已回答, "END" - 測驗結束)
let state = "QUESTION";

// 宣告全域變數：使用者點選的選項索引 (-1 表示未選取)
let selectedOption = -1;

// 宣告全域變數：儲存「下一題 / 重新測驗」按鈕 DOM 元件
let nextBtn;

function setup() {
  // 建立與視窗尺寸相同的全螢幕畫布
  createCanvas(windowWidth, windowHeight);

  // 設定文字對齊方式為水平居中與垂直居中
  textAlign(CENTER, CENTER);

  // 初始化測驗題目資料（共 5 題國中英文單字測驗）
  questions = [
    {
      q: "1. 請問「蘋果」的英文是什麼？",
      options: ["Apple", "Banana", "Cat", "Dog"],
      correct: 0 // 正確答案索引：Apple
    },
    {
      q: "2. 請問「學校」的英文是什麼？",
      options: ["Hospital", "School", "Library", "Park"],
      correct: 1 // 正確答案索引：School
    },
    {
      q: "3. 請問「美麗的」的英文是什麼？",
      options: ["Ugly", "Angry", "Beautiful", "Sad"],
      correct: 2 // 正確答案索引：Beautiful
    },
    {
      q: "4. 請問「星期日」的英文是什麼？",
      options: ["Monday", "Friday", "Saturday", "Sunday"],
      correct: 3 // 正確答案索引：Sunday
    },
    {
      q: "5. 請問「學生」的英文是什麼？",
      options: ["Teacher", "Student", "Doctor", "Driver"],
      correct: 1 // 正確答案索引：Student
    }
  ];

  // 建立按鈕 DOM 元件，預設文字為「下一題」
  nextBtn = createButton("下一題");

  // 為按鈕綁定點擊事件 handlers
  nextBtn.mousePressed(handleNextButton);

  // 靜態套用按鈕的 CSS 基礎樣式與過渡動畫
  nextBtn.style("position", "absolute");
  nextBtn.style("cursor", "pointer");
  nextBtn.style("border-radius", "30px");
  nextBtn.style("border", "none");
  nextBtn.style("background-color", "#ffffff");
  nextBtn.style("color", "#121216");
  nextBtn.style("font-weight", "bold");
  nextBtn.style("box-shadow", "0 6px 16px rgba(0,0,0,0.4)");
  nextBtn.style("transition", "transform 0.1s ease, background-color 0.2s");

  // 初始化隱藏按鈕，等回答後才顯示
  nextBtn.hide();
}

function draw() {
  // 設定背景顏色為深灰色現代調色
  background(18, 18, 22);

  // 繪製背景裝飾性漸層微光（增加視覺質感）
  noStroke();
  fill(255, 255, 255, 4);
  ellipse(width / 2, height / 2, max(width, height) * 0.8);

  // 根據當前狀態判斷繪製測驗畫面或最終結算畫面
  if (state === "END") {
    // 繪製測驗結束結算畫面
    drawEndScreen();
  } else {
    // 繪製題目與選擇按鈕畫面
    drawQuestionScreen();
  }
}

// 輔助函式：動態計算不同螢幕尺寸下的佈局變數
function getResponsiveLayout() {
  // 判斷是否為手機或橫向行動裝置
  let isMobile = width < 600 || height < 500;
  let isLandscapeMobile = height < 500 && width > height;

  // 動態計算題目字型大小
  let titleSize = constrain(min(width * 0.045, height * 0.045), 18, 30);
  if (isLandscapeMobile) titleSize = constrain(height * 0.06, 16, 22);

  // 動態計算選項字型大小
  let optionTextSize = constrain(min(width * 0.035, height * 0.032), 15, 22);
  if (isLandscapeMobile) optionTextSize = 15;

  // 動態計算選項卡片寬度 (桌機最大 520px，手機滿版留邊)
  let btnW = min(width * 0.88, 520);
  if (isLandscapeMobile) btnW = min(width * 0.7, 450);

  // 動態計算選項卡片高度
  let btnH = constrain(height * 0.07, 42, 62);
  if (isLandscapeMobile) btnH = 36;

  // 動態計算選項之間的垂直間距
  let spacing = btnH + constrain(height * 0.02, 10, 20);
  if (isLandscapeMobile) spacing = btnH + 8;

  // 動態計算題目垂直位置 (Y座標)
  let titleY = height * 0.14;
  if (isLandscapeMobile) titleY = height * 0.12;

  // 動態計算第一個選項按鈕的起始 Y 座標
  let startY = height * 0.28;
  if (isLandscapeMobile) startY = height * 0.24;

  // 動態計算按鈕垂直位置
  let nextBtnY = startY + 4 * spacing + constrain(height * 0.02, 10, 30);
  if (isLandscapeMobile) nextBtnY = startY + 4 * spacing + 10;

  return { titleSize, optionTextSize, btnW, btnH, spacing, titleY, startY, nextBtnY };
}

function drawQuestionScreen() {
  // 取得當前響應式佈局數值
  let layout = getResponsiveLayout();
  // 取得當前題目的物件資料
  let qData = questions[currentQ];

  // 繪製頂部進度文字
  fill(160, 160, 185);
  textSize(layout.optionTextSize * 0.85);
  text(`第 ${currentQ + 1} / ${questions.length} 題`, width / 2, layout.titleY - layout.titleSize * 1.5);

  // 繪製題目文字
  fill(245, 245, 250);
  textSize(layout.titleSize);
  textStyle(BOLD);
  text(qData.q, width / 2, layout.titleY);

  // 迴圈繪製 4 個響應式選項按鈕
  for (let i = 0; i < 4; i++) {
    // 計算當前選項按鈕的左上角 X 座標 (使其水平居中)
    let x = width / 2 - layout.btnW / 2;

    // 計算當前選項按鈕的左上角 Y 座標
    let y = layout.startY + i * layout.spacing;

    // 判斷當前測驗狀態以動態切換色彩與 hover 效果
    if (state === "QUESTION") {
      // 答題中狀態：檢查滑鼠或觸控是否懸停在按鈕區域內
      if (mouseX > x && mouseX < x + layout.btnW && mouseY > y && mouseY < y + layout.btnH) {
        fill(65, 68, 82); // 懸停時高亮暗灰色
      } else {
        fill(40, 42, 52); // 預設深灰背景色
      }
    } else if (state === "ANSWERED") {
      // 已回答狀態：顯示答題結果對應色彩
      if (i === qData.correct) {
        // 正確答案一律顯示指定 #cad182 綠色
        fill("#cad182");
      } else if (i === selectedOption) {
        // 若點選錯誤則該選項顯示指定 #c1121f 紅色
        fill("#c1121f");
      } else {
        // 其餘未選取的非正確選項顯示極暗灰色
        fill(30, 31, 38);
      }
    }

    // 繪製選項卡片陰影效果
    noStroke();
    fill(0, 0, 0, 40);
    rect(x + 2, y + 4, layout.btnW, layout.btnH, 12);

    // 重新繪製選項卡片本體
    if (state === "QUESTION") {
      if (mouseX > x && mouseX < x + layout.btnW && mouseY > y && mouseY < y + layout.btnH) {
        fill(65, 68, 82);
      } else {
        fill(40, 42, 52);
      }
    } else if (state === "ANSWERED") {
      if (i === qData.correct) {
        fill("#cad182");
      } else if (i === selectedOption) {
        fill("#c1121f");
      } else {
        fill(30, 31, 38);
      }
    }
    rect(x, y, layout.btnW, layout.btnH, 12);

    // 判斷選項文字顏色：綠色背景時用深字，其餘用高對比白字
    if (state === "ANSWERED" && i === qData.correct) {
      fill(20, 30, 15); // 深綠黑色字
    } else if (state === "ANSWERED" && i !== qData.correct && i !== selectedOption) {
      fill(120, 120, 135); // 灰色弱化未選非正確選項
    } else {
      fill(255); // 白色文字
    }

    // 設定選項文字字型大小與粗細
    textSize(layout.optionTextSize);
    textStyle(NORMAL);

    // 在選項卡片中央繪製選項文字內容
    text(qData.options[i], width / 2, y + layout.btnH / 2);
  }

  // 當使用者回答完畢時，更新並居中顯示「下一題」按鈕
  if (state === "ANSWERED") {
    // 動態計算按鈕內邊距與字型大小
    let btnPaddingV = constrain(layout.btnH * 0.25, 8, 14);
    let btnPaddingH = constrain(layout.btnW * 0.1, 20, 40);
    let btnFontSize = constrain(layout.optionTextSize * 0.95, 15, 20);

    // 即時設定 DOM 按鈕樣式
    nextBtn.style("font-size", btnFontSize + "px");
    nextBtn.style("padding", `${btnPaddingV}px ${btnPaddingH}px`);

    // 計算按鈕水平居中位置
    let btnWidth = nextBtn.elt.offsetWidth;
    nextBtn.position(width / 2 - btnWidth / 2, layout.nextBtnY);

    // 顯示按鈕
    nextBtn.show();
  }
}

function drawEndScreen() {
  // 動態取得響應式佈局變數
  let layout = getResponsiveLayout();

  // 繪製「測驗結束」標題文字
  fill(255);
  textSize(layout.titleSize * 1.3);
  textStyle(BOLD);
  text("🎉 測驗結束！", width / 2, height * 0.32);

  // 繪製答對題數結算文字 (綠色 #cad182)
  fill("#cad182");
  textSize(layout.titleSize * 1.1);
  text(`您一共答對了 ${score} / ${questions.length} 題`, width / 2, height * 0.44);

  // 繪製等級評語反饋
  fill(200, 200, 220);
  textSize(layout.optionTextSize);
  textStyle(NORMAL);
  let feedback = "";
  if (score === 5) feedback = "太厲害了！完全全對 💯";
  else if (score >= 3) feedback = "做得好！繼續保持 💪";
  else feedback = "再接再厲！多複習英文單字喔 📖";
  text(feedback, width / 2, height * 0.52);

  // 設定「重新測試」按鈕樣式與動態置中
  nextBtn.html("重新測試");
  let btnFontSize = constrain(layout.optionTextSize * 0.95, 15, 20);
  nextBtn.style("font-size", btnFontSize + "px");
  nextBtn.style("padding", "12px 36px");

  let btnWidth = nextBtn.elt.offsetWidth;
  nextBtn.position(width / 2 - btnWidth / 2, height * 0.64);

  // 顯示按鈕
  nextBtn.show();
}

function mousePressed() {
  // 若當前不是「答題中」狀態，直接結束不處理點擊
  if (state !== "QUESTION") return;

  // 取得當前響應式佈局尺寸
  let layout = getResponsiveLayout();

  // 檢測點擊/觸控座標是否落在 4 個選項區域之一
  for (let i = 0; i < 4; i++) {
    let x = width / 2 - layout.btnW / 2;
    let y = layout.startY + i * layout.spacing;

    // 判斷點擊座標落在卡片框內
    if (mouseX > x && mouseX < x + layout.btnW && mouseY > y && mouseY < y + layout.btnH) {
      // 紀錄使用者點選的選項索引
      selectedOption = i;

      // 比對點選項目是否為正確答案，若是則累計得分
      if (i === questions[currentQ].correct) {
        score++;
      }

      // 切換狀態為「已回答」 (ANSWERED)
      state = "ANSWERED";

      // 已找到點擊按鈕，跳出迴圈
      break;
    }
  }
}

function handleNextButton() {
  if (state === "ANSWERED") {
    // 當前為答題結束狀態，切換至下一題
    currentQ++;

    // 檢查是否還有剩餘題目
    if (currentQ < questions.length) {
      // 重置選取狀態為未選取 (-1)
      selectedOption = -1;

      // 重置畫面狀態為「答題中」 (QUESTION)
      state = "QUESTION";

      // 隱藏「下一題」按鈕
      nextBtn.hide();
    } else {
      // 已完成全部 5 題，切換狀態為「測驗結束」 (END)
      state = "END";
    }
  } else if (state === "END") {
    // 當前為測驗結束狀態，重置所有測驗變數
    currentQ = 0;          // 重置題目索引為第 0 題
    score = 0;             // 重置得分為 0
    selectedOption = -1;   // 重置選取選項
    state = "QUESTION";    // 切換狀態為答題中

    // 將按鈕文字恢復為「下一題」
    nextBtn.html("下一題");

    // 隱藏按鈕
    nextBtn.hide();
  }
}

function windowResized() {
  // 自動調整畫布大小至新的視窗寬高 (全螢幕無縫自動適應)
  resizeCanvas(windowWidth, windowHeight);
}
</script>

</body>
</html>
